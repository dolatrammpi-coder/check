<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Darpan - Auto Updater</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f4f7fb; padding: 20px; color: #1e293b; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #0f172a; margin-top: 0; font-size: 24px; }
        label { font-size: 14px; font-weight: 700; color: #475569; margin-top: 15px; display: block; }
        input, select { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; background: #f8fafc; }
        input:focus, select:focus { outline: none; border-color: #2563eb; background: #fff; }
        button { width: 100%; padding: 14px; background: #004085; color: white; border: none; font-weight: bold; font-size: 16px; cursor: pointer; border-radius: 6px; margin-top: 25px; transition: background 0.3s; }
        button:hover { background: #002752; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .status { text-align: center; margin-top: 15px; font-weight: bold; display: none; padding: 10px; border-radius: 6px; }
        .success { color: #16a34a; background: #dcfce7; border: 1px solid #bbf7d0; }
        .error { color: #dc2626; background: #fee2e2; border: 1px solid #fecaca; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🚀 Quick Post Updater</h2>
        
        <label>GitHub Token (Access Token)</label>
        <input type="password" id="ghToken" placeholder="ghp_........................">

        <label>Update Kis Section Me Jayega? (Homepage)</label>
        <select id="updateCategory">
            <option value="RESULT">Result Section</option>
            <option value="ADMIT_CARD">Admit Card Section</option>
            <option value="ANSWER_KEY">Answer Key Section</option>
            <option value="NONE">Sirf Vacancy Page Update Karo (Homepage nahi)</option>
        </select>

        <label>Target Vacancy Page (Eg: up-police-2026.html)</label>
        <input type="text" id="targetFile" placeholder="Enter .html filename">

        <label>Important Date Text (Eg: Admit Card Available)</label>
        <input type="text" id="dateText" placeholder="e.g. Admit Card Available">

        <label>Date Value (Eg: 15/08/2026)</label>
        <input type="text" id="dateValue" placeholder="15/08/2026">

        <label>New Link URL</label>
        <input type="url" id="linkUrl" placeholder="https://...">

        <button id="uploadBtn" onclick="pushUpdate()">Upload & Update Page</button>
        <div id="statusMsg" class="status"></div>
    </div>

    <script>
        // Aapki Repo ka naam
        const REPO = "dolatrammpi-coder/check"; 

        async function pushUpdate() {
            const token = document.getElementById('ghToken').value.trim();
            const targetFile = document.getElementById('targetFile').value.trim();
            const btn = document.getElementById('uploadBtn');
            const status = document.getElementById('statusMsg');

            if(!token) { alert("Bhai, GitHub Token daalna zaroori hai!"); return; }
            if(!targetFile) { alert("Target Page ka naam daaliye!"); return; }

            btn.innerText = "Uploading... Please wait";
            btn.disabled = true;
            status.style.display = "none";

            const data = {
                category: document.getElementById('updateCategory').value,
                target_file: targetFile,
                date_text: document.getElementById('dateText').value.trim(),
                date_value: document.getElementById('dateValue').value.trim(),
                link_url: document.getElementById('linkUrl').value.trim()
            };

            // Random file name taaki purani file overwrite na ho
            const timestamp = Date.now();
            const fileName = `updates/${targetFile.replace('.html', '')}_${timestamp}.json`;
            
            // JSON ko safely Base64 mein convert karna
            const contentStr = JSON.stringify(data, null, 4);
            const base64Content = btoa(unescape(encodeURIComponent(contentStr)));

            try {
                const response = await fetch(`https://api.github.com/repos/${REPO}/contents/${fileName}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Auto Update: ${targetFile}`,
                        content: base64Content
                    })
                });

                if(response.ok) {
                    status.innerText = "✅ Upload Successful! Auto-Update Started.";
                    status.className = "status success";
                    
                    // Box khali karna agle update ke liye (Token waisa hi rahega)
                    document.getElementById('targetFile').value = '';
                    document.getElementById('dateText').value = '';
                    document.getElementById('dateValue').value = '';
                    document.getElementById('linkUrl').value = '';
                } else {
                    const err = await response.json();
                    status.innerText = "❌ Upload Failed: Token galat hai ya Permission nahi hai.";
                    status.className = "status error";
                }
            } catch(e) {
                status.innerText = "❌ Network Error! Internet check karein.";
                status.className = "status error";
            }

            status.style.display = "block";
            btn.innerText = "Upload & Update Page";
            btn.disabled = false;
        }
    </script>
</body>
</html>
