<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Darpan - Auto Updater</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #f4f7fb; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #0f172a; margin-top: 0; }
        label { font-size: 14px; font-weight: 700; color: #475569; margin-top: 15px; display: block; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 6px; }
        button { width: 100%; padding: 14px; background: #004085; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; margin-top: 20px; }
        .status { text-align: center; margin-top: 15px; font-weight: bold; display: none; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🚀 Quick Post Updater</h2>
        
        <label>GitHub Token (Access Token)</label>
        <input type="password" id="ghToken" placeholder="ghp_........................">

        <label>Update Kis Section Me Jayega?</label>
        <select id="updateCategory" onchange="updateDefaultTitle()">
            <option value="RESULT">Result Section</option>
            <option value="ADMIT_CARD">Admit Card Section</option>
            <option value="CITY_INTIMATION">City Intimation Section</option>
            <option value="ANSWER_KEY">Answer Key Section</option>
            <option value="NONE">Sirf Vacancy Page Update</option>
        </select>

        <label>Update Title (Link Name)</label>
        <input type="text" id="updateTitle" placeholder="e.g. Result Download">

        <label>Target Vacancy Page</label>
        <input type="text" id="targetFile" placeholder="e.g. up-police-2026.html">

        <label>Important Date Text (Optional)</label>
        <input type="text" id="dateText" placeholder="e.g. Admit Card Available">

        <label>Date Value (Optional)</label>
        <input type="text" id="dateValue" placeholder="e.g. 15/08/2026">

        <label>New Link URL</label>
        <input type="url" id="linkUrl" placeholder="https://...">

        <button id="uploadBtn" onclick="pushUpdate()">Upload & Update Page</button>
        <div id="statusMsg" class="status"></div>
    </div>

    <script>
        const REPO = "dolatrammpi-coder/check"; 

        function updateDefaultTitle() {
            const cat = document.getElementById('updateCategory').value;
            const titles = {
                "RESULT": "Result Download",
                "ADMIT_CARD": "Admit Card Download",
                "CITY_INTIMATION": "Check City Details",
                "ANSWER_KEY": "Check Answer Key",
                "NONE": ""
            };
            document.getElementById('updateTitle').value = titles[cat] || "";
        }
        window.onload = updateDefaultTitle;

        async function pushUpdate() {
            const token = document.getElementById('ghToken').value.trim();
            const targetFile = document.getElementById('targetFile').value.trim();
            const btn = document.getElementById('uploadBtn');
            const status = document.getElementById('statusMsg');

            if(!token || !targetFile) { alert("Token aur Target Page daalna zaroori hai!"); return; }

            btn.innerText = "Uploading... Please wait";
            btn.disabled = true;

            const data = {
                category: document.getElementById('updateCategory').value,
                target_file: targetFile,
                update_title: document.getElementById('updateTitle').value.trim(),
                date_text: document.getElementById('dateText').value.trim(),
                date_value: document.getElementById('dateValue').value.trim(),
                link_url: document.getElementById('linkUrl').value.trim()
            };

            const fileName = `updates/${targetFile.replace('.html', '')}_${Date.now()}.json`;
            const contentStr = JSON.stringify(data, null, 4);
            const base64Content = btoa(unescape(encodeURIComponent(contentStr)));

            try {
                const response = await fetch(`https://api.github.com/repos/${REPO}/contents/${fileName}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Auto Update: ${targetFile}`, content: base64Content })
                });

                if(response.ok) {
                    status.innerText = "✅ Upload Successful! Action Started.";
                    status.style.color = "green"; status.style.display = "block";
                } else {
                    status.innerText = "❌ Upload Failed. Check Token.";
                    status.style.color = "red"; status.style.display = "block";
                }
            } catch(e) { alert("Network Error!"); }
            btn.innerText = "Upload & Update Page"; btn.disabled = false;
        }
    </script>
</body>
</html>
