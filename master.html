<!doctype html>
<html lang="hi">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
Loading... - Exam Darpan
</title>

<meta
  name="description"
  id="metaDescription"
  content="Government Job Information - Exam Darpan"
>

<meta
  name="robots"
  content="index,follow"
>


<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:#f5f6f8;

  color:#222;
}

a{
  color:inherit;
  text-decoration:none;
}


/* ================= HEADER ================= */

.header{
  background:#fff;

  border-bottom:1px solid #ddd;
}

.header-inner{
  max-width:1050px;

  margin:auto;

  padding:14px 16px;
}

.logo{
  font-size:25px;

  font-weight:800;
}

.logo span{
  color:#d00000;
}

.back{
  display:inline-block;

  margin-top:8px;

  color:#d00000;

  font-size:13px;

  font-weight:700;
}

.back:hover{
  text-decoration:underline;
}


/* ================= MAIN ================= */

.container{
  max-width:1050px;

  margin:auto;

  padding:18px 16px 40px;
}


/* ================= HERO ================= */

.hero{
  background:#fff;

  border:1px solid #ddd;

  border-radius:6px;

  padding:18px;

  margin-bottom:16px;
}

.hero h1{
  margin:0 0 8px;

  font-size:24px;

  line-height:1.4;
}

.organization{
  color:#666;

  font-size:14px;

  line-height:1.5;
}


/* ================= BOX ================= */

.box{
  background:#fff;

  border:1px solid #ddd;

  border-radius:6px;

  overflow:hidden;

  margin-bottom:16px;
}

.box-title{
  background:#111;

  color:#fff;

  padding:11px 14px;

  font-size:17px;

  font-weight:700;
}

.box-content{
  padding:14px;
}


/* ================= TABLE ================= */

.info-table{
  width:100%;

  border-collapse:collapse;

  font-size:14px;
}

.info-table td{
  border:1px solid #ddd;

  padding:10px;

  vertical-align:top;

  line-height:1.5;
}

.info-table td:first-child{
  width:35%;

  font-weight:700;

  background:#fafafa;
}


/* ================= LINKS ================= */

.link-row{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    auto;

  gap:12px;

  align-items:center;

  padding:11px 13px;

  border-bottom:1px solid #eee;

  font-size:14px;

  line-height:1.4;
}

.link-row:last-child{
  border-bottom:0;
}

.link-row:hover{
  background:#fafafa;
}

.link-row a:hover{
  color:#d00000;
}

.click{
  color:#d00000;

  font-size:12px;

  font-weight:700;

  white-space:nowrap;
}


/* ================= TEXT ================= */

.text{
  font-size:14px;

  line-height:1.65;
}

.text p{
  margin:0 0 10px;
}

.text p:last-child{
  margin-bottom:0;
}

.text ul{
  margin-top:8px;
  padding-left:20px;
}

.text li{
  margin-bottom:7px;
}


/* ================= FAQ ================= */

.faq{
  border-bottom:1px solid #eee;
}

.faq:last-child{
  border-bottom:0;
}

.faq-question{
  padding:12px 14px;

  font-size:14px;

  font-weight:700;

  line-height:1.5;
}

.faq-answer{
  padding:0 14px 13px;

  color:#555;

  font-size:14px;

  line-height:1.6;
}


/* ================= ERROR ================= */

.error{
  background:#fff;

  border:1px solid #ddd;

  border-radius:6px;

  padding:20px;

  color:#b00000;

  font-size:14px;
}


/* ================= FOOTER ================= */

footer{
  background:#111;

  color:#ddd;
}

.footer-inner{
  max-width:1050px;

  margin:auto;

  padding:25px 16px;

  text-align:center;
}

.footer-links{
  display:flex;

  justify-content:center;

  flex-wrap:wrap;

  gap:10px 18px;

  margin-bottom:15px;

  font-size:13px;
}

.footer-links a:hover{
  color:#fff;
}

.copyright{
  color:#999;

  font-size:12px;
}


/* ================= MOBILE ================= */

@media(max-width:650px){

  .container{
    padding:12px 12px 30px;
  }

  .hero{
    padding:15px;
  }

  .hero h1{
    font-size:20px;
  }

  .info-table{
    font-size:13px;
  }

  .info-table td{
    padding:8px;
  }

  .info-table td:first-child{
    width:42%;
  }

  .link-row{
    font-size:13px;

    padding:10px;
  }

  .box-title{
    font-size:15px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="header-inner">

    <div class="logo">
      Exam <span>Darpan</span>
    </div>

    <a
      href="/"
      class="back"
    >
      ← Back to Home
    </a>

  </div>

</header>



<!-- =====================================================
     PAGE
===================================================== -->

<main
  class="container"
  id="app"
>

  <div class="error">
    Loading...
  </div>

</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

  <div class="footer-inner">

    <div class="footer-links">

      <a href="/">
        Home
      </a>

      <a href="/about.html">
        About Us
      </a>

      <a href="/contact.html">
        Contact Us
      </a>

      <a href="/privacy-policy.html">
        Privacy Policy
      </a>

      <a href="/disclaimer.html">
        Disclaimer
      </a>

    </div>

    <div class="copyright">

      © 2026 Exam Darpan. All Rights Reserved.

    </div>

  </div>

</footer>



<script>

/* =====================================================
   CONFIG
===================================================== */

const DATA_PATH = "data/";


/* =====================================================
   GET ID FROM URL
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const vacancyId =
  params.get("id");


/* =====================================================
   LOAD JSON
===================================================== */

async function loadVacancy(){

  if(!vacancyId){

    showError(
      "Vacancy ID नहीं मिला।"
    );

    return;

  }


  try{

    const filename =
      vacancyId + ".json";


    const response =
      await fetch(
        DATA_PATH + filename,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "JSON file not found"
      );

    }


    const data =
      await response.json();


    renderVacancy(data);


  }catch(error){

    console.error(
      error
    );


    showError(
      "यह vacancy उपलब्ध नहीं है या इसकी JSON file नहीं मिली।"
    );

  }

}


/* =====================================================
   RENDER VACANCY
===================================================== */

function renderVacancy(data){

  const title =
    data.title ||
    "Government Job";


  /* ================= TITLE ================= */

  document.title =
    title +
    " - Exam Darpan";


  /* ================= DESCRIPTION ================= */

  const description =
    data.meta_description ||
    (
      title +
      " recruitment details, eligibility, vacancy, important dates and important links."
    );


  document
    .getElementById(
      "metaDescription"
    )
    .setAttribute(
      "content",
      description
    );


  /* ================= APP ================= */

  const app =
    document.getElementById(
      "app"
    );


  let html = "";


  /* =================================================
     HERO
  ================================================= */

  html += `

    <section class="hero">

      <h1>
        ${safe(title)}
      </h1>

      ${
        data.organization
          ? `
            <div class="organization">
              ${safe(
                data.organization
              )}
            </div>
          `
          : ""
      }

    </section>

  `;


  /* =================================================
     BASIC INFORMATION
  ================================================= */

  if(
    data.basic_info &&
    Object.keys(
      data.basic_info
    ).length
  ){

    html +=
      createTableSection(
        data.basic_info_title ||
        "Vacancy Details",

        data.basic_info
      );

  }


  /* =================================================
     IMPORTANT DATES
  ================================================= */

  if(
    data.important_dates
  ){

    html +=
      createTableSection(
        "Important Dates",

        data.important_dates
      );

  }


  /* =================================================
     APPLICATION FEE
  ================================================= */

  if(
    data.application_fee
  ){

    html +=
      createTableSection(
        "Application Fee",

        data.application_fee
      );

  }


  /* =================================================
     AGE LIMIT
  ================================================= */

  if(
    data.age_limit
  ){

    html +=
      createTableSection(
        "Age Limit",

        data.age_limit
      );

  }


  /* =================================================
     ELIGIBILITY
  ================================================= */

  if(
    data.eligibility
  ){

    html +=
      createTextSection(
        "Eligibility",

        data.eligibility
      );

  }


  /* =================================================
     VACANCY
  ================================================= */

  if(
    data.vacancy
  ){

    html +=
      createTableSection(
        "Vacancy Details",

        data.vacancy
      );

  }


  /* =================================================
     SELECTION
  ================================================= */

  if(
    data.selection_process
  ){

    html +=
      createTextSection(
        "Selection Process",

        data.selection_process
      );

  }


  /* =================================================
     EXAM PATTERN
  ================================================= */

  if(
    data.exam_pattern
  ){

    html +=
      createTableSection(
        "Exam Pattern",

        data.exam_pattern
      );

  }


  /* =================================================
     SYLLABUS
  ================================================= */

  if(
    data.syllabus
  ){

    html +=
      createTextSection(
        "Syllabus",

        data.syllabus
      );

  }


  /* =================================================
     IMPORTANT LINKS
  ================================================= */

  if(
    Array.isArray(
      data.important_links
    ) &&
    data.important_links.length
  ){

    html += `

      <section class="box">

        <div class="box-title">
          Important Links
        </div>

        <div>

    `;


    data.important_links
      .forEach(link => {

        if(!link){
          return;
        }


        const url =
          link.url ||
          "#";


        html += `

          <div class="link-row">

            <a
              href="${safeAttr(url)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${safe(
                link.name ||
                "Important Link"
              )}
            </a>

            <span class="click">
              Click Here
            </span>

          </div>

        `;

      });


    html += `

        </div>

      </section>

    `;

  }


  /* =================================================
     FAQ
  ================================================= */

  if(
    Array.isArray(
      data.faq
    ) &&
    data.faq.length
  ){

    html += `

      <section class="box">

        <div class="box-title">
          Frequently Asked Questions
        </div>

    `;


    data.faq.forEach(item => {

      if(!item){
        return;
      }


      html += `

        <div class="faq">

          <div class="faq-question">
            ${safe(
              item.question
            )}
          </div>

          <div class="faq-answer">
            ${safe(
              item.answer
            )}
          </div>

        </div>

      `;

    });


    html += `

      </section>

    `;

  }


  /* =================================================
     FINAL
  ================================================= */

  if(!html.trim()){

    html = `

      <div class="error">
        इस vacancy की जानकारी उपलब्ध नहीं है।
      </div>

    `;

  }


  app.innerHTML =
    html;

}


/* =====================================================
   TABLE SECTION
===================================================== */

function createTableSection(
  title,
  data
){

  let html = `

    <section class="box">

      <div class="box-title">
        ${safe(title)}
      </div>

      <div class="box-content">

        <table class="info-table">

          <tbody>

  `;


  if(
    data &&
    typeof data === "object" &&
    !Array.isArray(data)
  ){

    Object.entries(
      data
    ).forEach(
      ([key,value]) => {

        html += `

          <tr>

            <td>
              ${safe(key)}
            </td>

            <td>
              ${formatValue(value)}
            </td>

          </tr>

        `;

      }
    );

  }else{

    html += `

      <tr>

        <td>
          Details
        </td>

        <td>
          ${formatValue(data)}
        </td>

      </tr>

    `;

  }


  html += `

          </tbody>

        </table>

      </div>

    </section>

  `;


  return html;

}


/* =====================================================
   TEXT SECTION
===================================================== */

function createTextSection(
  title,
  content
){

  let html = "";


  if(
    Array.isArray(content)
  ){

    /*
      Array होने पर bullet list
    */

    html += "<ul>";


    content.forEach(
      item => {

        html +=
          "<li>" +
          safe(item) +
          "</li>";

      }
    );


    html += "</ul>";


  }else{

    html =
      "<p>" +
      safe(content) +
      "</p>";

  }


  return `

    <section class="box">

      <div class="box-title">
        ${safe(title)}
      </div>

      <div class="box-content text">

        ${html}

      </div>

    </section>

  `;

}


/* =====================================================
   FORMAT VALUE
===================================================== */

function formatValue(value){

  if(
    Array.isArray(value)
  ){

    let html =
      "<ul>";


    value.forEach(
      item => {

        html +=
          "<li>" +
          safe(item) +
          "</li>";

      }
    );


    html +=
      "</ul>";


    return html;

  }


  return safe(value);

}


/* =====================================================
   ERROR
===================================================== */

function showError(
  message
){

  document
    .getElementById("app")
    .innerHTML =

    `

      <div class="error">

        ${safe(message)}

      </div>

    `;

}


/* =====================================================
   SAFE HTML
===================================================== */

function safe(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   SAFE ATTRIBUTE
===================================================== */

function safeAttr(
  value
){

  return safe(value);

}


/* =====================================================
   START
===================================================== */

loadVacancy();

</script>


</body>

</html>
