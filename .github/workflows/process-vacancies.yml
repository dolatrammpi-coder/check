name: Auto Generate Vacancy Page

on:
  push:
    paths:
      - 'pdfs/*.pdf'
      - 'updates/*.json' # Yahan updates folder bhi add kar lein taaki updater se json aaye toh action chal jaye
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyPDF2 google-generativeai

    - name: Run All Python Scripts
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python scripts/generate_post.py
        python scripts/update_post.py
      
    - name: Commit and Push Changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add -A
        git commit -m "Auto-generated new vacancy page and updated index.html" || echo "No changes to commit"
        git push || echo "No changes to push"
