<!doctype html>
<html lang="hi">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Exam Darpan - Latest Government Jobs, Results, Admit Card</title>

<meta
  name="description"
  content="Exam Darpan पर Latest Government Jobs, Recruitment, Admit Card, Results, Answer Key, Syllabus और सरकारी परीक्षाओं की जानकारी पाएं."
>

<meta name="robots" content="index,follow">

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6f8;
  color:#222;
}

a{
  color:inherit;
  text-decoration:none;
}

/* ================= HEADER ================= */

.header{
  background:#fff;
  border-bottom:1px solid #ddd;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  padding:14px 16px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:25px;
  font-weight:800;
  line-height:1;
}

.logo span{
  color:#d00000;
}

.tagline{
  margin-top:5px;
  font-size:12px;
  color:#777;
}


/* ================= SEARCH ================= */

.search-area{
  max-width:1100px;
  margin:18px auto 10px;
  padding:0 16px;
}

.search-box{
  display:flex;

  background:#fff;

  border:1px solid #d7d7d7;
  border-radius:6px;

  overflow:hidden;
}

.search-box input{
  flex:1;
  min-width:0;

  border:0;
  outline:0;

  padding:13px 14px;

  font-size:15px;
}

.search-box button{
  border:0;

  background:#111;
  color:#fff;

  padding:0 20px;

  cursor:pointer;

  font-size:14px;
}


/* ================= MAIN ================= */

.container{
  max-width:1100px;
  margin:auto;

  padding:8px 16px 35px;
}


/* ================= INTRO ================= */

.intro{
  background:#fff;

  border:1px solid #ddd;
  border-radius:6px;

  padding:17px;

  margin-bottom:16px;
}

.intro h1{
  margin:0 0 7px;

  font-size:21px;
}

.intro p{
  margin:0;

  color:#555;

  font-size:14px;
  line-height:1.55;
}


/* ================= TWO COLUMN ================= */

.columns{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:18px;

  align-items:start;
}

.column{
  min-width:0;
}

.column.left{
  padding-right:9px;

  border-right:1px solid #d8d8d8;
}

.column.right{
  padding-left:9px;
}


/* ================= CATEGORY ================= */

.category{
  background:#fff;

  border:1px solid #d9d9d9;
  border-radius:6px;

  overflow:hidden;

  margin-bottom:16px;
}

.category-title{
  background:#111;

  color:#fff;

  padding:11px 13px;

  font-size:16px;
  font-weight:700;
}

.category-count{
  float:right;

  font-size:11px;
  font-weight:400;

  opacity:.75;
}


/* ================= VACANCY LINK ================= */

.link-row{
  display:grid;

  grid-template-columns:minmax(0,1fr) auto;

  gap:12px;

  align-items:center;

  padding:10px 12px;

  border-bottom:1px solid #eee;

  font-size:14px;

  line-height:1.4;
}

.link-row:last-child{
  border-bottom:0;
}

.link-row:hover{
  background:#fafafa;
}

.link-name{
  min-width:0;
}

.link-name a{
  color:#222;
}

.link-name a:hover{
  color:#d00000;
}

.click{
  color:#d00000;

  font-size:12px;
  font-weight:700;

  white-space:nowrap;
}


/* ================= NO DATA ================= */

.empty{
  padding:14px;

  color:#777;

  font-size:13px;
}


/* ================= FOOTER ================= */

footer{
  background:#111;

  color:#ddd;

  margin-top:20px;
}

.footer-inner{
  max-width:1100px;
  margin:auto;

  padding:25px 16px;

  text-align:center;
}

.footer-links{
  display:flex;

  justify-content:center;

  flex-wrap:wrap;

  gap:8px 18px;

  margin-bottom:15px;

  font-size:13px;
}

.footer-links a:hover{
  color:#fff;
}

.copyright{
  color:#999;

  font-size:12px;

  line-height:1.6;
}


/* ================= MOBILE ================= */

@media(max-width:760px){

  .header-inner{
    padding:12px;
  }

  .logo{
    font-size:22px;
  }

  .tagline{
    display:none;
  }

  .search-area{
    padding:0 12px;
  }

  .container{
    padding:8px 12px 25px;
  }

  .columns{
    display:block;
  }

  .column.left,
  .column.right{
    padding:0;
    border:0;
  }

  .link-row{
    font-size:13px;

    padding:9px 10px;
  }

  .category-title{
    font-size:15px;
  }

}


/* ================= SMALL MOBILE ================= */

@media(max-width:420px){

  .search-box button{
    padding:0 14px;
  }

  .link-row{
    gap:7px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="header-inner">

    <div>

      <div class="logo">
        Exam <span>Darpan</span>
      </div>

      <div class="tagline">
        Government Jobs • Results • Admit Card • Answer Key
      </div>

    </div>

  </div>

</header>



<!-- =====================================================
     SEARCH
===================================================== -->

<div class="search-area">

  <div class="search-box">

    <input
      type="search"
      id="searchInput"
      placeholder="Search vacancy, exam, result..."
      autocomplete="off"
    >

    <button
      type="button"
      onclick="searchJobs()"
    >
      Search
    </button>

  </div>

</div>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


  <section class="intro">

    <h1>
      Latest Government Jobs & Exam Updates
    </h1>

    <p>
      Latest Government Jobs, Recruitment, Admit Card,
      Results, Answer Key और Syllabus की जानकारी एक ही जगह।
    </p>

  </section>



  <div class="columns">


    <!-- ================= LEFT ================= -->

    <div
      class="column left"
      id="leftColumn"
    ></div>


    <!-- ================= RIGHT ================= -->

    <div
      class="column right"
      id="rightColumn"
    ></div>


  </div>


</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

  <div class="footer-inner">

    <div class="footer-links">

      <a href="/">
        Home
      </a>

      <a href="/about.html">
        About Us
      </a>

      <a href="/contact.html">
        Contact Us
      </a>

      <a href="/privacy-policy.html">
        Privacy Policy
      </a>

      <a href="/disclaimer.html">
        Disclaimer
      </a>

    </div>


    <div class="copyright">

      © 2026 Exam Darpan. All Rights Reserved.

    </div>

  </div>

</footer>



<script>

/* =====================================================
   CONFIG
===================================================== */

const DATA_PATH = "data/";


/* =====================================================
   GLOBAL DATA
===================================================== */

let allJobs = [];


/* =====================================================
   LOAD MANIFEST
===================================================== */

async function loadJobs(){

  const left =
    document.getElementById("leftColumn");

  const right =
    document.getElementById("rightColumn");


  try{

    const response =
      await fetch(
        DATA_PATH + "manifest.json",
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "manifest.json not found"
      );

    }


    const manifest =
      await response.json();


    let files = [];


    /*
      दोनों formats support होंगे:

      [
        "abc.json"
      ]

      या

      {
        "files":[
          "abc.json"
        ]
      }
    */


    if(Array.isArray(manifest)){

      files = manifest;

    }else if(
      manifest &&
      Array.isArray(manifest.files)
    ){

      files = manifest.files;

    }


    if(!files.length){

      throw new Error(
        "No JSON files found"
      );

    }


    /*
      सभी JSON files एक साथ load
    */

    const results =
      await Promise.all(

        files.map(
          async file => {

            try{

              const filename =
                typeof file === "string"
                  ? file
                  : file.file;


              if(!filename){
                return null;
              }


              const response =
                await fetch(
                  DATA_PATH + filename,
                  {
                    cache:"no-store"
                  }
                );


              if(!response.ok){

                console.warn(
                  "JSON not found:",
                  filename
                );

                return null;

              }


              const data =
                await response.json();


              return data;


            }catch(error){

              console.error(
                "JSON loading error:",
                file,
                error
              );

              return null;

            }

          }
        )

      );


    allJobs =
      results.filter(
        item => item !== null
      );


    renderJobs(allJobs);


  }catch(error){

    console.error(error);


    left.innerHTML = `

      <section class="category">

        <div class="category-title">
          Latest Updates
        </div>

        <div class="empty">
          Vacancy data load नहीं हो सका।
        </div>

      </section>

    `;


    right.innerHTML = "";

  }

}


/* =====================================================
   RENDER ALL JOBS
===================================================== */

function renderJobs(jobs){

  const left =
    document.getElementById("leftColumn");

  const right =
    document.getElementById("rightColumn");


  left.innerHTML = "";

  right.innerHTML = "";


  /*
    Category के हिसाब से grouping
  */

  const categories = {};


  jobs.forEach(job => {

    if(!job){
      return;
    }


    const category =
      job.category ||
      "Latest Government Jobs";


    if(!categories[category]){

      categories[category] = [];

    }


    categories[category].push(job);

  });


  const categoryNames =
    Object.keys(categories);


  /*
    Category order JSON में दिया गया हो
    तो उसका order रखा जा सकता है।
  */


  categoryNames.forEach(
    (category,index) => {

      const section =
        createCategory(
          category,
          categories[category]
        );


      /*
        0,2,4...
        LEFT

        1,3,5...
        RIGHT
      */

      if(index % 2 === 0){

        left.appendChild(section);

      }else{

        right.appendChild(section);

      }

    }
  );


  if(!categoryNames.length){

    left.innerHTML = `

      <section class="category">

        <div class="category-title">
          Latest Updates
        </div>

        <div class="empty">
          अभी कोई vacancy उपलब्ध नहीं है।
        </div>

      </section>

    `;

  }

}


/* =====================================================
   CREATE CATEGORY
===================================================== */

function createCategory(
  category,
  jobs
){

  const section =
    document.createElement("section");


  section.className =
    "category";


  /*
    Category title
  */

  const title =
    document.createElement("div");


  title.className =
    "category-title";


  title.innerHTML =

    escapeHTML(category) +

    '<span class="category-count">' +

    jobs.length +

    '</span>';


  section.appendChild(title);


  /*
    Vacancy rows
  */

  jobs.forEach(job => {

    const row =
      document.createElement("div");


    row.className =
      "link-row";


    /*
      Search data
    */

    row.dataset.search =

      (
        job.title || ""

      ) +

      " " +

      (
        job.organization || ""
      ) +

      " " +

      (
        job.category || ""
      ) +

      " " +

      (
        job.search_keywords || ""
      )

      .toLowerCase();


    /*
      Name
    */

    const name =
      document.createElement("div");


    name.className =
      "link-name";


    const link =
      document.createElement("a");


    /*
      IMPORTANT:

      यहाँ किसी vacancy का HTML नहीं है।

      सभी vacancy:
      master.html?id=JSON_ID

      पर जाएँगी।
    */

    link.href =
      "master.html?id=" +
      encodeURIComponent(
        job.id
      );


    link.textContent =
      job.title ||
      "Untitled Vacancy";


    name.appendChild(link);


    /*
      Click Here
    */

    const click =
      document.createElement("div");


    click.className =
      "click";


    click.textContent =
      "Click Here";


    row.appendChild(name);

    row.appendChild(click);

    section.appendChild(row);

  });


  return section;

}


/* =====================================================
   SEARCH
===================================================== */

function searchJobs(){

  const input =
    document.getElementById(
      "searchInput"
    );


  const query =
    input.value
      .trim()
      .toLowerCase();


  const categories =
    document.querySelectorAll(
      ".category"
    );


  categories.forEach(
    category => {

      let visible = 0;


      const rows =
        category.querySelectorAll(
          ".link-row"
        );


      rows.forEach(row => {

        const text =
          (
            row.dataset.search ||
            ""
          ).toLowerCase();


        const match =
          query === "" ||
          text.includes(query);


        row.style.display =
          match
            ? ""
            : "none";


        if(match){

          visible++;

        }

      });


      category.style.display =
        visible
          ? ""
          : "none";

    }
  );

}


/* =====================================================
   ENTER KEY SEARCH
===================================================== */

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        searchJobs();

      }


      if(
        event.key === "Escape"
      ){

        this.value = "";

        searchJobs();

        this.blur();

      }

    }
  );


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   START
===================================================== */

loadJobs();

</script>


</body>
</html>
