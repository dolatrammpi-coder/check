<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lotus Flower</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 40%, #fff7fc 0%, #f8e8f4 45%, #d9c5dc 100%);
  font-family: Arial, sans-serif;
}

.scene {
  width: min(90vw, 520px);
  height: min(90vw, 520px);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.water {
  position: absolute;
  bottom: 7%;
  width: 100%;
  height: 28%;
  border-radius: 50%;
  background:
    radial-gradient(ellipse at center, rgba(255,255,255,.65), transparent 65%),
    linear-gradient(180deg, #9ed8e2, #5aa6b8);
  opacity: .9;
  box-shadow: 0 15px 35px rgba(40,90,110,.25);
}

.lotus {
  position: relative;
  width: 78%;
  height: 58%;
  margin-top: -12%;
  filter: drop-shadow(0 18px 14px rgba(75,35,75,.18));
}

.petal {
  position: absolute;
  left: 50%;
  bottom: 8%;
  width: 27%;
  height: 68%;
  transform-origin: 50% 100%;
  border-radius: 70% 70% 15% 15%;
  background: linear-gradient(135deg, #fffaff 0%, #ffd9ed 48%, #e88abd 100%);
  border: 2px solid rgba(196,80,145,.18);
}

.p1 { transform: translateX(-50%) rotate(0deg); z-index: 7; }
.p2 { transform: translateX(-50%) rotate(-27deg); z-index: 6; }
.p3 { transform: translateX(-50%) rotate(27deg); z-index: 6; }
.p4 { transform: translateX(-50%) rotate(-54deg) scale(.92); z-index: 5; }
.p5 { transform: translateX(-50%) rotate(54deg) scale(.92); z-index: 5; }
.p6 { transform: translateX(-50%) rotate(-78deg) scale(.82); z-index: 4; }
.p7 { transform: translateX(-50%) rotate(78deg) scale(.82); z-index: 4; }

.center {
  position: absolute;
  z-index: 10;
  left: 50%;
  bottom: 13%;
  transform: translateX(-50%);
  width: 18%;
  aspect-ratio: 1;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, #fff5a8 0 7%, transparent 8%),
    radial-gradient(circle at 65% 40%, #f6c83d 0 7%, transparent 8%),
    radial-gradient(circle at 45% 70%, #e8a51c 0 7%, transparent 8%),
    #f4b52f;
  box-shadow: 0 3px 10px rgba(160,100,10,.3);
}

.glow {
  position: absolute;
  width: 55%;
  height: 20%;
  top: 8%;
  left: 22%;
  border-radius: 50%;
  background: rgba(255,255,255,.55);
  filter: blur(20px);
}
</style>
</head>

<body>
  <div class="scene">
    <div class="glow"></div>

    <div class="lotus">
      <div class="petal p6"></div>
      <div class="petal p7"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p1"></div>
      <div class="center"></div>
    </div>

    <div class="water"></div>
  </div>
</body>
</html>
